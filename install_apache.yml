---
- hosts: all
  become: true
  tasks:

   # - name: update repo index before installing packages
   #   ansible.builtin.apt:
   #    update_cache: yes
   #   when: ansible_distribution == "Ubuntu"

   - name: install apache2 package
     ansible.builtin.apt:
       name: 
         - apache2
         - libapache2-mod-php
       state: latest
       update_cache: yes
     when: ansible_distribution == "Ubuntu"

   # - name: install php support for apache
   #   ansible.builtin.apt:
